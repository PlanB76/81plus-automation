name: EMAILFLUX81 · Post Acquisto
# Invia le email post-acquisto (Grazie, Onboarding, Referral)
on:
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch: {}
concurrency: { group: emailflux81-post_acquisto, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: emailflux81 } }
    env:
      EMAIL81_DB: 81plus.db
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_DIR:  ${{ secrets.FTP_DIR }}
      FTP_DB_PATH: ${{ secrets.FTP_DB_PATH }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      BASE_URL:  https://81plus.net
      DRY_RUN:   ${{ secrets.DRY_RUN }}
      DAILY_CAP: ${{ secrets.DAILY_CAP }}
      FTP_TIMEOUT: "120"
      FTP_TRIES: "5"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_ADMIN_ID: ${{ secrets.TG_ADMIN_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Scarica DB dall'host
        run: python ftp_db.py get
      - name: Worker Post Acquisto
        run: python e81_run.py
      - name: Ricarica DB aggiornato sull'host
        if: success()
        run: python ftp_db.py put
